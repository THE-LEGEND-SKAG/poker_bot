[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-ai"
version = "0.1.0"
description = "Playable No-Limit Hold'em platform with rule-based, Monte Carlo, exploitative, CFR and neural agents"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[tool.setuptools.packages.find]
include = ["poker_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: exhaustive checks (deselect with -m 'not slow')"]
