[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-ai"
version = "0.1.0"
description = "Playable No-Limit Hold'em platform with rule-based, Monte Carlo, exploitative, CFR and neural agents"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.27"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
train = ["torch>=2.2"]

[tool.setuptools.packages.find]
include = ["poker_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: exhaustive checks (deselect with -m 'not slow')"]
