# Keeps the Render free-tier server from sleeping (it sleeps after ~15 min idle),
# so visitors don't wait ~30 s on Render's "Application loading" page.
#
# Setup (once): GitHub repo -> Settings -> Secrets and variables -> Actions ->
# Variables -> New repository variable: SITE_URL = https://<your-app>.onrender.com
#
# Note: GitHub may delay scheduled runs at busy times and pauses schedules in repos
# with no activity for 60 days; re-enable from the Actions tab if that happens.
name: Keep site awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping the health endpoint
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::notice::Set the SITE_URL repository variable to enable keep-awake pings."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 "${SITE_URL%/}/api/health"
          echo
